<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדליק – סרטון למשפחות</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#050b18;color:#fbf1dc;font-family:'Rubik','Heebo',sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  .stage{width:min(100%,420px)}
  @media (min-width:900px){.stage{width:min(100%,460px)}}
  canvas{width:100%;height:auto;display:block;background:#000;border-radius:22px;box-shadow:0 30px 80px -30px #000}
  .bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:18px 0 4px}
  button{min-height:52px;padding:0 26px;border:0;border-radius:999px;font:700 1rem 'Rubik',sans-serif;cursor:pointer;color:#0a2244;background:linear-gradient(120deg,#ff6a00,#ff9a2e 55%,#ffc42d);box-shadow:0 12px 24px -10px rgba(255,106,0,.7)}
  button.ghost{background:transparent;color:#fbf1dc;border:1px solid rgba(251,241,220,.35);box-shadow:none}
  button:disabled{opacity:.5;cursor:default}
  .hint{text-align:center;color:rgba(251,241,220,.6);font-size:.9rem;margin:8px 0 0}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="720" height="1280" aria-label="סרטון: ערב חנוכה משפחתי במדליק"></canvas>
  <div class="bar">
    <button id="play">▶ הפעלה עם סאונד</button>
    <button id="rec" class="ghost">⬇ הקלטה והורדה כקובץ וידאו</button>
  </div>
  <p class="hint" id="hint">27 שניות · עם קריינות וסאונד</p>
</div>
<script>
/* ============================================================
   מדליק – סרטון קצר לנותני שירות, בסגנון קאפקט (אנכי 9:16):
   כתוביות קופצות עם מילה מודגשת, חיתוכים מהירים עם גליץ' וזום,
   מדבקות, ספירה חיה, תצוגת אתר, דוח, וקריינות גבר.
   הכול מצויר בזמן אמת וקצוב לביט (120 BPM).
   ============================================================ */
const W = 720, H = 1280, BPM = 120, B = 60 / BPM, DUR = 27;
const cv = document.getElementById('c'), out = cv.getContext('2d');
const sc = Object.assign(document.createElement('canvas'), {width: W, height: H}), g = sc.getContext('2d');
const tmp = Object.assign(document.createElement('canvas'), {width: W, height: H}), tg = tmp.getContext('2d');
const bl = Object.assign(document.createElement('canvas'), {width: 180, height: 320}), bg2 = bl.getContext('2d');
const NAVY = '#0a2244', OR = '#ff6a00', YEL = '#ffc42d', CREAM = '#fbf1dc', CY = '#4fd1ff', GR = '#33d17a', PK = '#ff4f9a';
const FONT = "Rubik,Heebo,Arial,sans-serif";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const eo = t => 1 - Math.pow(1 - t, 3), eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eob = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const ph = (t, a, d) => clamp((t - a) / d), frac = x => x - Math.floor(x), pulse = (t, k = 9) => Math.exp(-k * frac(t / B));
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const logo = new Image(); logo.src = '../img/logo-mark.png';
const noise = (() => { const n = document.createElement('canvas'); n.width = n.height = 256; const x = n.getContext('2d'), d = x.createImageData(256, 256); let s = 777; for (let i = 0; i < d.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return n; })();
const CUTS = [];
let S = .6;
function setScale(s) { S = s; const w = Math.round(W * s), h = Math.round(H * s); cv.width = sc.width = tmp.width = w; cv.height = sc.height = tmp.height = h; }
setScale(S);
/* אימוג'י כספרייט שמור: ציור טקסט צבעוני יקר, ולכן מציירים כל אימוג'י פעם אחת בלבד */
const EMO = new Map(), _ft = g.fillText.bind(g);
g.fillText = function (s, x, y) {
  if (typeof s === 'string' && s.length <= 8 && /\p{Extended_Pictographic}/u.test(s) && !/[א-ת]/.test(s)) {
    const m = /(\d+)px/.exec(this.font), px = m ? +m[1] : 64, key = s + px; let c = EMO.get(key);
    if (!c) { const n = Math.ceil(px * 1.6); c = document.createElement('canvas'); c.width = c.height = n; const x2 = c.getContext('2d'); x2.font = `400 ${px}px ${FONT}`; x2.textAlign = 'center'; x2.textBaseline = 'middle'; x2.fillText(s, n / 2, n / 2 + px * .04); EMO.set(key, c); }
    this.drawImage(c, x - c.width / 2, y - c.height / 2); return;
  }
  return _ft(s, x, y);
};

/* ---------------- עזרים ---------------- */
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function txt(s, x, y, size, color, o = {}) {
  g.save(); g.font = `${o.w || 900} ${size}px ${FONT}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
  if (o.shadow) { g.shadowColor = o.shadow; g.shadowBlur = o.sb || 20; }
  if (o.stroke) { g.lineWidth = o.sw || size * .14; g.strokeStyle = o.stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
/* כתובית קאפקט: קפיצה עם פיק, קו מתאר עבה, ומילה מודגשת בתיבה צבעונית */
function cap(s, t, t0, x, y, size, o = {}) {
  if (t < t0 || (o.until && t > o.until + .3)) return;
  const a = t - t0; let k = a < .16 ? lerp(.25, 1.2, eo(a / .16)) : lerp(1.2, 1, eo(clamp((a - .16) / .14)));
  let al = 1; if (o.until && t > o.until) { const q = ph(t, o.until, .3); k *= 1 - q * .4; al = 1 - q; }
  g.save(); g.globalAlpha = al; g.translate(x, y); g.rotate(o.rot || 0); g.scale(k, k);
  g.font = `900 ${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
  const w = g.measureText(s).width;
  if (o.hl) { g.fillStyle = 'rgba(0,0,0,.35)'; rr(-w / 2 - 28, -size * .66 + 12, w + 56, size * 1.32, 30); g.fill(); g.fillStyle = o.hl; rr(-w / 2 - 28, -size * .66, w + 56, size * 1.32, 30); g.fill(); }
  else { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillText(s, 0, size * .07); g.lineWidth = size * .17; g.strokeStyle = '#000'; g.lineJoin = 'round'; g.strokeText(s, 0, 0); }
  g.fillStyle = o.hl ? (o.c || NAVY) : (o.c || '#fff'); g.fillText(s, 0, 0); g.restore();
}
/* מדבקת אימוג'י עם מסגרת לבנה */
function sticker(em, t, t0, x, y, size, rot = 0, o = {}) {
  if (t < t0) return; const a = t - t0, k = a < .22 ? lerp(.1, 1.25, eo(a / .22)) : lerp(1.25, 1, eo(clamp((a - .22) / .16)));
  const bob = Math.sin(t * 4 + x) * 5 * (o.bob == null ? 1 : o.bob);
  g.save(); g.translate(x, y + bob); g.rotate(rot + Math.sin(t * 3 + y) * .05); g.scale(k, k);
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.arc(0, 8, size * .78, 0, Math.PI * 2); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, size * .78, 0, Math.PI * 2); g.fill();
  g.font = `400 ${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(em, 0, size * .04); g.restore();
}
const mc = Object.assign(document.createElement('canvas'), {width: 120, height: 214}), mg = mc.getContext('2d');
function mesh(t, c1, c2, c3) {
  mg.fillStyle = '#060f24'; mg.fillRect(0, 0, 120, 214);
  [[c1, .2, .22, 1], [c2, .85, .5, 2.3], [c3, .3, .85, 3.7]].forEach(([c, bx, by, ph0]) => {
    const x = (bx + Math.sin(t * .6 + ph0) * .16) * 120, y = (by + Math.cos(t * .5 + ph0) * .12) * 214;
    const gr = mg.createRadialGradient(x, y, 0, x, y, 120); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); mg.globalAlpha = .78; mg.fillStyle = gr; mg.fillRect(0, 0, 120, 214); mg.globalAlpha = 1;
  });
  g.imageSmoothingEnabled = true; g.drawImage(mc, 0, 0, W, H);
  g.save(); g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1; g.beginPath(); for (let x = 0; x < W; x += 48) { g.moveTo(x, 0); g.lineTo(x, H); } for (let y = 0; y < H; y += 48) { g.moveTo(0, y); g.lineTo(W, y); } g.stroke(); g.restore();
}
function confetti(t, t0, n = 60) {
  const d = t - t0; if (d < 0 || d > 2.4) return;
  for (let i = 0; i < n; i++) { const a = rnd(i) * Math.PI * 2, sp = 300 + rnd(i + 9) * 700, x = W / 2 + Math.cos(a) * sp * d, y = H * .45 + Math.sin(a) * sp * d * .9 + 520 * d * d; const c = [OR, YEL, CY, PK, GR, '#fff'][i % 6]; g.save(); g.globalAlpha = 1 - d / 2.4; g.translate(x, y); g.rotate(d * 6 + i); g.fillStyle = c; g.fillRect(-7, -3, 14, 6); g.restore(); }
}
function ring(t, t0, x, y, c = YEL, R = 800) { const p = ph(t, t0, .8); if (p > 0 && p < 1) { g.save(); g.strokeStyle = c; g.globalAlpha = 1 - p; g.lineWidth = 16 * (1 - p) + 2; g.beginPath(); g.arc(x, y, eo(p) * R, 0, Math.PI * 2); g.stroke(); g.restore(); } }

/* ---------------- מעברי חיתוך: זום, גליץ', הבזק ---------------- */
function cutFX(t) {
  for (const c of CUTS) { const d = t - c; if (d < 0 || d > .22) continue; const k = 1 - d / .22;
    tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, sc.width, sc.height); tg.drawImage(sc, 0, 0);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    for (let i = 0; i < 14; i++) { const y = Math.floor(rnd(i + c * 3) * sc.height), h = (14 + Math.floor(rnd(i + 5 + c) * 90)) * S, dx = (rnd(i + c * 7) - .5) * 160 * k * S; g.drawImage(tmp, 0, y, sc.width, h, dx, y, sc.width, h); }
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = .45 * k; g.drawImage(tmp, 14 * k * S, 0); g.globalCompositeOperation = 'screen'; g.fillStyle = `rgba(255,255,255,${.55 * k})`; g.fillRect(0, 0, sc.width, sc.height); g.restore();
  }
}

/* ============================================================
   סרטון משפחתי: ילד חמוד עם כיפה, הרבה ילדים משחקים ביחד, אבא מדפיס קלפים טיפוליים,
   ונרות חנוכה דולקים ברקע. דמויות מצוירות בקנבס, קצב 120 BPM, קריינות גבר.
   ============================================================ */
const FCUTS = [3, 9, 15, 21];
CUTS.length = 0; FCUTS.forEach(c => CUTS.push(c));
const cardImgs = [2, 7, 11, 15, 19].map(n => { const im = new Image(); im.src = `../img/miniatura/card-${String(n).padStart(2, '0')}.webp`; return im; });
const gameBits = ['כמה ימי חנוכה?', 'איזה סביבון?', 'מי מצא את האפיקומן?'];

/* ---------------- חדר חם עם נרות ---------------- */
function candle(x, y, t, i, lit) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#fff4d6'; rr(-7, -62, 14, 62, 4); g.fill(); g.fillStyle = 'rgba(255,106,0,.35)'; for (let k = 0; k < 3; k++) g.fillRect(-7, -52 + k * 18, 14, 5);
  if (lit > 0) {
    const f = 1 + Math.sin(t * 11 + i * 1.7) * .09 + Math.sin(t * 17 + i) * .05, sx = .85 + Math.sin(t * 9 + i * 2.3) * .08;
    g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(0, -86, 0, 0, -86, 90 * lit); gr.addColorStop(0, 'rgba(255,190,80,.55)'); gr.addColorStop(1, 'rgba(255,120,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(0, -86, 90 * lit, 0, Math.PI * 2); g.fill(); g.restore();
    g.translate(0, -66); g.scale(sx * lit, f * lit);
    g.fillStyle = '#ff7a1a'; g.beginPath(); g.moveTo(0, -34); g.bezierCurveTo(16, -12, 14, 6, 0, 8); g.bezierCurveTo(-14, 6, -16, -12, 0, -34); g.fill();
    g.fillStyle = '#ffd24a'; g.beginPath(); g.moveTo(0, -22); g.bezierCurveTo(9, -8, 8, 3, 0, 4); g.bezierCurveTo(-8, 3, -9, -8, 0, -22); g.fill();
  }
  g.restore();
}
function hanukkiah(cx, cy, k, t, t0 = 0) {
  g.save(); g.translate(cx, cy); g.scale(k, k);
  g.fillStyle = '#c9902f'; rr(-215, -12, 430, 26, 13); g.fill(); g.fillRect(-14, 14, 28, 52); g.fillStyle = '#a8741f'; rr(-70, 62, 140, 22, 11); g.fill();
  for (let i = 0; i < 9; i++) { const x = (i - 4) * 46, sh = i === 4, lit = clamp((t - (t0 + Math.abs(i - 4) * .22 * 1)) / .35); g.save(); g.translate(x, -12); if (sh) g.translate(0, -34); candle(0, 0, t, i, lit); g.restore(); g.fillStyle = '#c9902f'; g.fillRect(x - 3, -16, 6, 8); }
  g.restore();
}
function room(t, glow = 1) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#190d3a'); gr.addColorStop(.6, '#2f1650'); gr.addColorStop(1, '#4b2160'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // חלון עם ירח וכוכבים
  g.save(); g.fillStyle = '#0b1b46'; rr(40, 60, 200, 280, 100); g.fill(); g.strokeStyle = '#8a5a2e'; g.lineWidth = 10; g.stroke(); g.beginPath(); g.moveTo(140, 60); g.lineTo(140, 340); g.moveTo(40, 200); g.lineTo(240, 200); g.stroke();
  g.fillStyle = '#fff4c2'; g.beginPath(); g.arc(180, 130, 24, 0, 6.3); g.fill(); g.fillStyle = '#0b1b46'; g.beginPath(); g.arc(190, 124, 22, 0, 6.3); g.fill();
  for (let i = 0; i < 14; i++) { const sx = 60 + rnd(i) * 160, sy = 90 + rnd(i + 3) * 230, tw = .5 + .5 * Math.sin(t * 3 + i * 2); g.fillStyle = `rgba(255,255,255,${.3 + .7 * tw})`; g.fillRect(sx, sy, 3, 3); } g.restore();
  // אורות בוקה
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 12; i++) { const x = rnd(i + 8) * W, y = 300 + rnd(i + 2) * 700, r = 30 + rnd(i + 5) * 60, a = (.05 + .05 * Math.sin(t * 1.4 + i)) * glow; const bg = g.createRadialGradient(x, y, 0, x, y, r); bg.addColorStop(0, `rgba(255,190,90,${a * 3})`); bg.addColorStop(1, 'rgba(255,190,90,0)'); g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill(); } g.restore();
  // רצפה
  g.fillStyle = '#2a1245'; g.fillRect(0, 1100, W, 180); g.fillStyle = 'rgba(255,180,90,.12)'; g.fillRect(0, 1100, W, 6);

  // זוהר חם כללי
  g.save(); g.globalCompositeOperation = 'lighter'; const wg = g.createRadialGradient(W / 2, 1100, 20, W / 2, 1000, 560); wg.addColorStop(0, `rgba(255,170,60,${.34 * glow})`); wg.addColorStop(1, 'rgba(255,120,0,0)'); g.fillStyle = wg; g.fillRect(0, 500, W, 780); g.restore();

/* ---------------- דמויות ---------------- */
function person(o) {
  const {x, y, s = 1, skin = '#f5c9a0', shirt = '#4fa3ff', pants = '#2b3f7a', hair = '#5a3a22', kippah = null, bow = null, beard = false, glasses = false, mood = 'happy', ph0 = 0, t = 0, up = false, jump = 0, waveL = false, dad = false, pig = false} = o;
  const hop = jump ? Math.abs(Math.sin(t * 5 + ph0)) * jump : 0, bob = Math.sin(t * 4 + ph0) * 3;
  g.save(); g.translate(x, y - hop); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(0, hop + 6, 70 - hop * .3, 12, 0, 0, 6.3); g.fill();

  // רגליים

  // גוף

  if (dad) { g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(-4, -lh - bh + 10, 8, bh - 10); }
  // זרועות
  g.lineCap = 'round'; g.lineWidth = dad ? 30 : 26; g.strokeStyle = shirt;
  const sy = -lh - bh + 28, wv = Math.sin(t * 9 + ph0) * .35;
  g.beginPath(); g.moveTo(-bw / 2 + 6, sy); if (up) g.lineTo(-bw / 2 - 30, sy - 70 + Math.sin(t * 8 + ph0) * 14); else g.lineTo(-bw / 2 - 18, sy + 56); g.stroke();
  g.beginPath(); g.moveTo(bw / 2 - 6, sy); if (up || waveL) g.lineTo(bw / 2 + 30 + wv * 10, sy - 74 + Math.sin(t * 8 + ph0 + 1) * 16); else g.lineTo(bw / 2 + 18, sy + 56); g.stroke();
  g.fillStyle = skin; [[-bw / 2 - (up ? 30 : 18), sy + (up ? -70 : 56)], [bw / 2 + (up || waveL ? 30 : 18), sy + (up || waveL ? -74 : 56)]].forEach(([hx, hy]) => { g.beginPath(); g.arc(hx, hy + (up ? Math.sin(t * 8 + ph0) * 7 : 0), 15, 0, 6.3); g.fill(); });
  // ראש
  const hy = -lh - bh - hr + 12 + bob; g.save(); g.translate(0, hy);
  g.fillStyle = hair; if (pig) { g.beginPath(); g.arc(-hr - 4, 4, 18, 0, 6.3); g.arc(hr + 4, 4, 18, 0, 6.3); g.fill(); }
  g.fillStyle = skin; g.beginPath(); g.arc(0, 0, hr, 0, 6.3); g.fill(); g.beginPath(); g.arc(-hr, 6, 12, 0, 6.3); g.arc(hr, 6, 12, 0, 6.3); g.fill();
  g.fillStyle = hair; g.beginPath(); g.arc(0, -4, hr + 2, Math.PI * 1.05, Math.PI * 1.95); g.fill();
  if (kippah) { g.fillStyle = kippah; g.beginPath(); g.ellipse(-8, -hr + 8, 34, 16, -.12, Math.PI, 0); g.fill(); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.beginPath(); g.ellipse(-8, -hr + 8, 28, 11, -.12, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  if (bow) { g.fillStyle = bow; g.beginPath(); g.moveTo(hr * .55, -hr + 6); g.lineTo(hr * .55 + 30, -hr - 8); g.lineTo(hr * .55 + 30, -hr + 22); g.closePath(); g.moveTo(hr * .55, -hr + 6); g.lineTo(hr * .55 - 26, -hr - 8); g.lineTo(hr * .55 - 26, -hr + 22); g.closePath(); g.fill(); g.beginPath(); g.arc(hr * .55, -hr + 6, 7, 0, 6.3); g.fill(); }
  if (beard) { g.fillStyle = '#3a2616'; g.beginPath(); g.moveTo(-hr * .85, 6); g.quadraticCurveTo(-hr * .9, hr + 16, 0, hr + 20); g.quadraticCurveTo(hr * .9, hr + 16, hr * .85, 6); g.quadraticCurveTo(0, 26, -hr * .85, 6); g.fill(); }
  // פנים
